[project]
name = "VAEX"
version = "1.6"
description = "Variational auto-encoder producing counterfactual explanations of a classifier."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "drytorch>=0.1.0",
    "h5py>=3.16.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.11.1",
    "numpy>=2.0.0",
    "pandas>=3.0.5",
    "pillow>=12.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "torch>=2.7.0",
    "torchmetrics[image]>=1.8",
    "torchvision>=0.27.1",
    "tqdm>=4.66.5",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
finetune = ["optuna>=4.6.0", "plotly>=7.1.0"]
track_all = [
    "tensorboard>=2.20.0",
    "wandb>=0.23.1",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "ruff==0.17.1",
]

[tool.basedpyright]
exclude = ["old_test", "reference", "scratch", "tests", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torchmetrics = { index = "pypi" }

# the PyTorch index of the user configuration comes first and hosts an outdated torchmetrics
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true
