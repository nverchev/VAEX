[project]
name = "drytorch-template"
version = "1.1"
description = "A general-purpose project template for the drytorch ML experimentation library."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "drytorch>=0.1.0rc9",
    "gdown>=6.1.0",
    "h5py>=3.16.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.11.1",
    "numpy>=2.0.0",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "pillow>=12.2.0",
    "plotly>=6.9.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.7.0",
    "torchvision>=0.27.1",
    "tqdm>=4.66.5",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
track_all = [
    "tensorboard>=2.20.0",
    "wandb>=0.23.1",
    "sqlalchemy>=2.0.0",
]
finetune = ["optuna>=4.6.0"]

[dependency-groups]
dev = [
    "basedpyright>=1.37.1",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "ruff>=0.14.11",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
