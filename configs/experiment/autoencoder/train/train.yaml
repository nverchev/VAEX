defaults:
  - learn: learn
  - early_stopping: early_stopping
  - _self_

n_epochs: 50
batch_size: 32
mixed_precision: null  # null = full precision
_n_subprocesses: ${user.n_subprocesses}
annealing_period: 45  # a single rise of the KL weight over 90% of the training
annealing_cycles: 1
adv_warmup_epochs: 3
