# User settings

seed:  # random seed (null = unset)

# Compute
cpu: false
n_workers: 0
n_subprocesses: 0  # 0 disables DDP

# Checkpointing
checkpoint_every: 10
load: 0  # -1 loads the latest checkpoint

# Trackers
trackers:
  hydra: true
  tensorboard: false
  wandb: false
  sqlalchemy: false
  csv: true

# Visualization options
plot:
  sample_indices:
    - 0
    - 1
    - 2
    - 5
    - 10
  use_train: false
  n_delta: 5
